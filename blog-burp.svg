<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450" role="img" aria-label="Burp Suite intercepting proxy illustration" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0000"/><stop offset="1" stop-color="#050000"/></linearGradient></defs>
  <rect width="700" height="450" fill="url(#bg)"/>
  <!-- browser -->
  <g>
    <rect x="40" y="150" width="150" height="150" rx="14" fill="#0d0000" stroke="#ff3030" stroke-width="1.5"/>
    <circle cx="60" cy="170" r="4" fill="#ff5a5a"/><circle cx="74" cy="170" r="4" fill="#ffb1b1"/><circle cx="88" cy="170" r="4" fill="#7a1a1a"/>
    <rect x="55" y="190" width="120" height="8" rx="4" fill="#3a0a0a"/><rect x="55" y="210" width="90" height="8" rx="4" fill="#3a0a0a"/><rect x="55" y="230" width="105" height="8" rx="4" fill="#3a0a0a"/>
    <text x="115" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffb1b1">Browser</text>
  </g>
  <!-- proxy -->
  <g>
    <rect x="250" y="110" width="200" height="230" rx="18" fill="#0d0000" stroke="#ff2a2a" stroke-width="2"/>
    <rect x="250" y="110" width="200" height="34" rx="18" fill="#c81010"/>
    <text x="350" y="133" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#fff">INTERCEPT ON</text>
    <g font-family="monospace" font-size="11" fill="#ffb1b1">
      <text x="266" y="170">POST /login HTTP/1.1</text>
      <text x="266" y="188">Host: lab.local</text>
      <text x="266" y="206">Cookie: session=…</text>
      <text x="266" y="224">Content-Type: x-www-form</text>
      <text x="266" y="252" fill="#ff5a5a">user=admin&amp;pass=****</text>
    </g>
    <rect x="266" y="285" width="78" height="30" rx="8" fill="#c81010"/><text x="305" y="305" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">Forward</text>
    <rect x="356" y="285" width="78" height="30" rx="8" fill="#0d0000" stroke="#ff3030"/><text x="395" y="305" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffb1b1">Drop</text>
    <text x="350" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffb1b1">Burp Proxy</text>
  </g>
  <!-- server -->
  <g>
    <rect x="510" y="150" width="150" height="150" rx="14" fill="#0d0000" stroke="#ff3030" stroke-width="1.5"/>
    <rect x="530" y="175" width="110" height="24" rx="6" fill="#3a0a0a"/><rect x="530" y="211" width="110" height="24" rx="6" fill="#3a0a0a"/><rect x="530" y="247" width="110" height="24" rx="6" fill="#3a0a0a"/>
    <circle cx="628" cy="187" r="4" fill="#ff5a5a"/><circle cx="628" cy="223" r="4" fill="#ff5a5a"/><circle cx="628" cy="259" r="4" fill="#ff5a5a"/>
    <text x="585" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffb1b1">Web app</text>
  </g>
  <g stroke="#ff3030" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M190 215H250"/><path d="M450 215H510"/>
  </g>
  <g fill="#ff3030"><path d="M240 208l12 7-12 7z"/><path d="M500 208l12 7-12 7z"/></g>
  <text x="350" y="60" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#ff5a5a">Every request stops here first</text>
</svg>
